command: /petsshop
hideHud: true
hideCrosshair: true
cursorMode: FROZEN
scrollables:
  - id: rows
    position:
      x: 404
      'y': 286
    size:
      width: 1108
      height: 486
    step: 240
    thumbId: rows_thumb
    trackId: rows_track
elements:
  - type: IMAGE
    id: panel_edge
    sprite: rect.png
    color: '#6B7894'
    position: { x: 960, y: 540 }
    size: { width: 1128, height: 708 }
    layer: 1
    alpha: 1
    corner: { shape: CUT, size: 9 }
    scrollRegion: none
  - type: IMAGE
    id: panel
    sprite: rect.png
    color: '#000000'
    position: { x: 960, y: 540 }
    size: { width: 1120, height: 700 }
    layer: 2
    alpha: 0.922
    corner: { shape: CUT, size: 8 }
    scrollRegion: none
  - type: TEXT
    id: title
    text: Pet shop
    spriteFont: minecraft
    glyphScale: 0.5
    color: '#F2F4F8'
    position: { x: 428, y: 854 }
    size: { width: 176, height: 32 }
    layer: 4
    anchor: { x: LEFT }
    textAlignment: LEFT
    scrollRegion: none
  - type: IMAGE
