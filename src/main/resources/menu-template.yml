    scrollRegion: rows
    scrollGroup: row1
  - type: TEXT
    id: card_2_name
    text: Ebony Cat Cubee
    spriteFont: minecraft
    glyphScale: 0.375
    color: '#F2F4F8'
    position: { x: 945, y: 586 }
    size: { width: 252, height: 24 }
    layer: 7
    scrollRegion: rows
    scrollGroup: row1
  - type: TEXT
    id: balance_label
    text: Balance
    spriteFont: minecraft
    glyphScale: 0.375
    color: '#B4B8C2'
    position: { x: 430, y: 248 }
    size: { width: 117, height: 24 }
    layer: 4
    anchor: { x: LEFT }
    textAlignment: LEFT
    scrollRegion: none
  - type: TEXT
    id: balance
    text: '%playerpoints_points_formatted% coins'
    spriteFont: minecraft
    glyphScale: 0.375
    color: '#FFC24A'
    position: { x: 559, y: 248 }
    size: { width: 588, height: 24 }
    layer: 4
    anchor: { x: LEFT }
    textAlignment: LEFT
    scrollRegion: none
  - type: IMAGE
    id: rows_track
    sprite: rect.png
    color: '#5A6273'
    position: { x: 1492, y: 794 }
    size: { width: 16, height: 486 }
    layer: 13
    corner: { shape: CUT, size: 4 }
    anchor: { x: LEFT, y: TOP }
    followZoom: false
  - type: IMAGE
    id: rows_thumb
    sprite: rect.png
    color: '#FFC24A'
    position: { x: 1492, y: 794 }
    size: { width: 16, height: 486 }
    layer: 14
    corner: { shape: CUT, size: 4 }
    anchor: { x: LEFT, y: TOP }
    followZoom: false
  - type: IMAGE
    position: { x: 1386, y: 236 }
    z: 10000
    size: { width: 200, height: 100 }
    layer: 4
    alpha: 1
    font: carl
    anchor: { x: CENTER, y: CENTER }
    followScale: true
    followZoom: true
    id: image_1
    scrollRegion: none
    sprite: backbutton.png
    actions:
      - { type: OPEN, target: mainmenu }
    hoverActions:
      - { type: PLAY_CLIP, clip: grow }
    unhoverActions:
      - { type: PLAY_CLIP, clip: shrink }
    timelines:
      grow:
        SCALE:
          - { size: { width: 210, height: 105 }, atTick: 3 }
      shrink:
        SCALE:
          - { size: { width: 200, height: 100 }, atTick: 3 }
hideVanilla:
  - HEARTS
  - HOTBAR
  - HAND
