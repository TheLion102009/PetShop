    scrollGroup: row1
  - type: IMAGE
    id: card_1
    sprite: rect.png
    color: '#161820'
    position: { x: 590, y: 668 }
    size: { width: 330, height: 220 }
    layer: 6
    corner: { shape: CUT, size: 8 }
    scrollRegion: rows
    scrollGroup: row1
  - type: ITEM
    id: card_1_item
