    position: { x: 590, y: 704 }
    size: { width: 128, height: 128 }
    layer: 7
    scrollRegion: rows
    scrollGroup: row1
  - type: TEXT
    id: card_1_name
    text: Jupiter Cubee
    spriteFont: minecraft
