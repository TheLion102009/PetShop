command: /shop
hideHud: true
hideCrosshair: true
cursorMode: FROZEN
scrollables:
  - id: rows
    position:
      x: 408
      'y': 278
    size:
      width: 1104
      height: 500
    step: 240
    thumbId: rows_thumb
    trackId: rows_track
elements:
  - type: IMAGE
    id: panel_edge
    sprite: rect.png
    color: '#6B7894'
    position: { x: 960, y: 540 }
    size: { width: 1128, height: 708 }
    layer: 1
    alpha: 1
    corner: { shape: CUT, size: 9 }
    scrollRegion: none
  - type: IMAGE
    id: panel
    sprite: rect.png
    color: '#000000'
    position: { x: 960, y: 540 }
    size: { width: 1120, height: 700 }
    layer: 2
    alpha: 0.922
    corner: { shape: CUT, size: 8 }
    scrollRegion: none
  - type: TEXT
    id: title
    text: Pet shop
    spriteFont: minecraft
    glyphScale: 0.5
    color: '#F2F4F8'
    position: { x: 428, y: 854 }
    size: { width: 176, height: 32 }
    layer: 4
    anchor: { x: LEFT }
    textAlignment: LEFT
    scrollRegion: none
  - type: TEXT
    id: title_right
    text: '%petshop_owned%/%petshop_total% pets owned'
    spriteFont: minecraft
    glyphScale: 0.25
    color: '#B4B8C2'
    position: { x: 1492, y: 854 }
    size: { width: 156, height: 16 }
    layer: 4
    anchor: { x: RIGHT }
    textAlignment: RIGHT
    scrollRegion: none
  - type: IMAGE
    id: title_rule
    sprite: rect.png
    color: '#4A5263'
    position: { x: 960, y: 822 }
    size: { width: 1080, height: 2 }
    layer: 3
    scrollRegion: none
  - type: IMAGE
    id: card_1_edge
    sprite: rect.png
    color: '#5A6273'
    position: { x: 595, y: 668 }
    size: { width: 338, height: 228 }
    layer: 3
    corner: { shape: CUT, size: 9 }
    timelines:
      grow:
        SCALE:
          - { size: { width: 354, height: 241 }, atTick: 3 }
      reset:
        SCALE:
          - { size: { width: 338, height: 228 }, atTick: 3 }
    scrollRegion: rows
    scrollGroup: card1
  - type: IMAGE
    id: card_1
    sprite: rect.png
    color: '#161820'
    position: { x: 595, y: 668 }
    size: { width: 330, height: 220 }
    layer: 4
    corner: { shape: CUT, size: 8 }
    actions:
      - { type: RUN_COMMAND, target: shop buy diamond_sword }
    timelines:
      grow:
        SCALE:
          - { size: { width: 346, height: 233 }, atTick: 3 }
      reset:
        SCALE:
          - { size: { width: 330, height: 220 }, atTick: 3 }
    scrollRegion: rows
    scrollGroup: card1
    hoverActions:
