    position: { x: 945, y: 668 }
    size: { width: 338, height: 228 }
    layer: 5
    corner: { shape: CUT, size: 9 }
    clickCooldown: 1000
    actions:
      - { type: RUN_COMMAND, target: petshop click cubee-ebony_cat }
    scrollRegion: rows
    scrollGroup: row1
  - type: IMAGE
    id: card_2
    sprite: rect.png
    color: '#161820'
