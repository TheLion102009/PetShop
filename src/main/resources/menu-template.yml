    color: '#5A6273'
    position: { x: 590, y: 668 }
    size: { width: 338, height: 228 }
    layer: 5
    corner: { shape: CUT, size: 9 }
    clickCooldown: 1000
    actions:
      - { type: RUN_COMMAND, target: petshop click cubee-jupiter }
